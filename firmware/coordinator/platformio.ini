[platformio]
default_envs = coordinator

[env]
build_flags =
    -std=gnu++17
    -Wall -Werror
    -fno-exceptions
    -Wno-unused-parameter
    -Wno-missing-field-initializers

lib_extra_dirs =
    ../shared/domain
    ../shared/application
    ../shared/protocol

[env:coordinator]
platform   = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = esp32-c6-devkitm-1
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
; -Wextra / -Wconversion / -Wshadow / -fno-rtti relaxed because arduino-esp32
; SDK headers (HardwareSerial, ESPAsyncWebServer, espMqttClient transitives)
; do not compile cleanly under these flags. Per-file pragmas would be too
; noisy. Re-evaluate after Phase B once Zigbee adapter reduces our Arduino
; surface area.
build_unflags =
    -Wextra
    -Wconversion
    -Wshadow
    -fno-rtti
build_flags =
    ${env.build_flags}
    -DGH_BUILD_TARGET=coordinator
    -DZIGBEE_MODE_ZCZR
    -Wno-conversion
    -Wno-shadow
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    bertmelis/espMqttClient@^1.7.0
    esp32async/AsyncTCP@^3.2.0
    esp32async/ESPAsyncWebServer@^3.6.0
    https://github.com/ETLCPP/etl-arduino.git#20.39.4
test_ignore =
    test_drivers
    test_drivers/*

[env:coordinator-native]
platform = native
build_flags =
    ${env.build_flags}
    -DGH_BUILD_TARGET=native
    -DUNITY_INCLUDE_DOUBLE
    -Wno-sign-conversion
    -I test
    -I lib/infrastructure/src
    -I ../shared/domain/src
    -I ../shared/protocol/src
test_framework = unity
lib_deps =
    https://github.com/ETLCPP/etl-arduino.git#20.39.4
test_ignore =
    test_drivers
    test_drivers/*
test_build_src = false

[env:coordinator-hwtest]
extends = env:coordinator
build_flags =
    ${env:coordinator.build_flags}
    -DGH_HW_TESTS=1
test_ignore =
test_filter = test_drivers/*
lib_deps =
    ${env:coordinator.lib_deps}
    robtillaart/AM2315C@^0.2.2
